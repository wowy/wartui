name: Firmware - Common

# `firmware/common` is a path dependency of all three firmwares, and their clippy
# compiles it without linting it: it is outside their workspaces. So it is
# linted here, from its own workspace, once per firmware, with the features that
# firmware turns on. Path-filtered: its own sources, `crates/wartui-proto` (which
# it depends on), each firmware's `Cargo.toml` (where those features are chosen),
# `rustfmt.toml`, or this file.

on:
  push:
    branches: ["main"]
    paths:
      - firmware/common/**
      - crates/wartui-proto/**
      - firmware/node/Cargo.toml
      - firmware/p4-radio/Cargo.toml
      - firmware/p4-bridge/Cargo.toml
      - .github/workflows/firmware-common.yml
      - rustfmt.toml
  pull_request:
    paths:
      - firmware/common/**
      - crates/wartui-proto/**
      - firmware/node/Cargo.toml
      - firmware/p4-radio/Cargo.toml
      - firmware/p4-bridge/Cargo.toml
      - .github/workflows/firmware-common.yml
      - rustfmt.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job rather than a matrix: linting is cheap next to a runner per combination. Each
  # clippy step runs even when an earlier one failed, so one push reports every firmware.
  common:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Add the P4 target
        run: rustup target add riscv32imafc-unknown-none-elf

      - name: Lint
        run: |
          pushd firmware/common
          cargo fmt --all -- --check
          popd

      - name: Clippy (node, ESP32-C5)
        if: success() || failure()
        run: |
          pushd firmware/common
          cargo clippy --release --features esp32c5 --locked -- -D warnings
          popd

      - name: Clippy (P4 bridge's radio, ESP32-C6)
        if: success() || failure()
        run: |
          pushd firmware/common
          cargo clippy --release --features esp32c6,radio --locked -- -D warnings
          popd

      # The P4 is a different target from the C-series chips.
      - name: Clippy (P4 bridge, ESP32-P4)
        if: success() || failure()
        run: |
          pushd firmware/common
          cargo clippy --release --features esp32p4,gps --target riscv32imafc-unknown-none-elf --locked -- -D warnings
          popd
