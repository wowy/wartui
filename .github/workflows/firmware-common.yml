name: Firmware - Common

# `firmware/common` is a path dependency of both firmwares, and their clippy
# compiles it without linting it: it is outside their workspaces. So it is
# linted here, from its own workspace, for each chip. Path-filtered like the
# firmware workflows: its own sources, `crates/wartui-proto` (which it depends
# on), `rustfmt.toml`, or this file.

on:
  push:
    branches: ["main"]
    paths:
      - firmware/common/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-common.yml
      - rustfmt.toml
  pull_request:
    paths:
      - firmware/common/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-common.yml
      - rustfmt.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, a clippy step per firmware: each lints the feature combination that firmware
  # builds, since a firmware's own clippy compiles this crate without linting it.
  common:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Add the P4 target
        run: rustup target add riscv32imafc-unknown-none-elf

      - name: Lint
        run: |
          pushd firmware/common
          cargo fmt --all -- --check
          popd

      - name: Clippy (node, ESP32-C5)
        run: |
          pushd firmware/common
          cargo clippy --release --features esp32c5,ota --locked -- -D warnings
          popd

      - name: Clippy (P4 bridge's radio, ESP32-C6)
        run: |
          pushd firmware/common
          cargo clippy --release --features esp32c6,ota,radio --locked -- -D warnings
          popd

      # The P4 is a different target from the C-series chips.
      - name: Clippy (P4 bridge, ESP32-P4)
        run: |
          pushd firmware/common
          cargo clippy --release --features esp32p4,gps,ota --target riscv32imafc-unknown-none-elf --locked -- -D warnings
          popd
