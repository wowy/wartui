name: Bindings

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: Kotlin and Swift smoke tests
    # Xcode 27 carries Swift 6.4, which the Swift written against the binding needs.
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # A pull request reads the cache `main` saved, and saves none of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The runner image carries Java and Swift; kotlinc comes from Homebrew when it is missing.
      - name: Install kotlinc
        run: command -v kotlinc || brew install kotlin

      - name: Run the smoke tests
        run: crates/wartui-ffi/smoke/run.sh all

  # The package's test is always built and linked for a simulator, which costs a minute. It runs
  # in one only where the binding, its generator or a dependency changed, on `main` and when asked
  # for by hand: a simulator's first boot on a fresh runner costs five to eight minutes for four
  # seconds of test.
  package-ios:
    name: Swift package and its test for an iOS simulator
    runs-on: xcode-27

    steps:
      # Two commits deep: a pull request is checked out as its merge into the base, whose first
      # parent is the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # A pull request reads the cache `main` saved, and saves none of its own. Keyed on the
      # script too: it names the iOS minimum the libraries are built for, which cargo does not
      # track, so objects cached under another minimum would be kept.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('crates/wartui-ffi/package/build.sh') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the XCFramework
        run: crates/wartui-ffi/package/build.sh ios

      # The runner's newest iPhone simulator, whichever that is. Naming one builds for this
      # runner's architecture alone, the one simulator slice the XCFramework holds, and boots
      # nothing.
      - name: Build the test for a simulator
        working-directory: crates/wartui-ffi/swift
        run: |
          uuid='[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}'
          device=$(xcrun simctl list devices available | grep -E '^\s+iPhone' |
            grep -oE "$uuid" | tail -n 1)
          [[ -n $device ]] || { echo "no iPhone simulator is available" >&2; exit 1; }
          echo "SIMULATOR=$device" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -scheme WartuiCore \
            -destination "platform=iOS Simulator,id=$device"

      - name: Decide whether the test runs
        id: simulator
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet HEAD^1 HEAD -- \
              crates/wartui-ffi crates/wartui-bindgen Cargo.lock .github/workflows/bindings.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "the pull request leaves the binding as it is: the test is built, not run"
          fi

      # Booted before the test asks for it: `xcodebuild` gives up on a test runner that is still
      # starting with its simulator.
      - name: Run the test in the simulator
        if: steps.simulator.outputs.run == 'true'
        working-directory: crates/wartui-ffi/swift
        run: |
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcodebuild test-without-building -scheme WartuiCore \
            -destination "platform=iOS Simulator,id=$SIMULATOR"

      - name: Zip the XCFramework with the Swift
        run: |
          kept=target/phone/ios/artifact
          mkdir -p "$kept"
          (cd crates/wartui-ffi/swift && zip -qr "$OLDPWD/$kept/WartuiCoreFFI.xcframework.zip" \
            WartuiCoreFFI.xcframework)
          cp crates/wartui-ffi/swift/Sources/WartuiCore/WartuiCore.swift "$kept/"

      - uses: actions/upload-artifact@v7
        with:
          name: wartui-core-ios
          path: target/phone/ios/artifact/
          if-no-files-found: error

  package-android:
    name: Android AAR and its test on an API 31 emulator
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # A pull request reads the cache `main` saved, and saves none of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The runner carries an Android SDK, its command-line tools and NDKs.
      - name: Build the AAR
        run: crates/wartui-ffi/package/build.sh android

      - uses: actions/upload-artifact@v7
        with:
          name: wartui-core-android
          path: target/phone/android/wartui-core.aar
          if-no-files-found: error

      # API 31 is the minimum the library claims, and x86_64 is what this runner emulates.
      - name: Let the runner user open KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # One directory named for both, since `avdmanager` and the emulator do not agree on a
      # default.
      - name: Install the emulator and the API 31 image
        run: |
          export ANDROID_AVD_HOME=$RUNNER_TEMP/avd
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          tools=$ANDROID_HOME/cmdline-tools/latest/bin
          yes | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" emulator platform-tools "system-images;android-31;default;x86_64"
          echo no | "$tools/avdmanager" create avd --name api31 \
            --package "system-images;android-31;default;x86_64"

      - name: Start the emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd api31 -no-window -no-audio \
            -no-boot-anim -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          adb=$ANDROID_HOME/platform-tools/adb
          for _ in $(seq 120); do
            if ! kill -0 "$emulator" 2> /dev/null; then
              echo "the emulator exited" >&2
              exit 1
            fi
            booted=$("$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r' || true)
            [[ $booted == 1 ]] && exit 0
            sleep 5
          done
          echo "the emulator did not boot within 10 minutes" >&2
          exit 1

      - name: Run the test on the emulator
        working-directory: crates/wartui-ffi/android
        run: ./gradlew :wartui-core:connectedAndroidTest

      - name: Show the emulator's log
        if: failure()
        run: cat "$RUNNER_TEMP/emulator.log"
