name: Application

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  wartui:
    name: Wartui
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev

      - name: Lint
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --all-targets --all-features --locked --verbose

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked --verbose

  phones:
    name: Phone targets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: aarch64-apple-ios
            os: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Bundled SQLite is compiled with the NDK's C compiler.
      - name: Use the NDK's C compiler
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Check
        run: cargo check -p wartui-bridge -p wartui-core -p wartui-app -p wartui-ffi --target ${{ matrix.target }} --locked

      - name: Portable crates name no desktop I/O
        if: matrix.target == 'aarch64-linux-android'
        run: |
          tree=$(cargo tree -p wartui-bridge -p wartui-core -p wartui-app -p wartui-ffi -e normal --prefix none --target all --locked)
          if grep -E '^(serialport|btleplug|dbus) ' <<< "$tree"; then
            echo "wartui-bridge, wartui-core, wartui-app or wartui-ffi depends on a desktop I/O crate" >&2
            exit 1
          fi
          direct=$(cargo tree -p wartui-bridge -p wartui-core -p wartui-app -p wartui-ffi -e normal --prefix none --depth 1 --target all --locked)
          if grep -E '^libc ' <<< "$direct"; then
            echo "wartui-bridge, wartui-core, wartui-app or wartui-ffi names libc directly" >&2
            exit 1
          fi
