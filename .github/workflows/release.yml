name: Release

# A pushed `v*` tag publishes the node images and the host binaries built from that one tree.
# `wartui flash-fleet` in a release binary fetches its node image from the release named by the
# tag baked into it (`WARTUI_RELEASE_TAG`), so the host and the fleet it flashes always share a
# tree. Each node image is merged — bootloader, partition table and app, flashed at 0x0 — and
# `SHA256SUMS` is what the host checks a download against.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  node:
    strategy:
      matrix:
        include:
          - { chip: esp32c5, features: esp32c5, asset: wartui-node-fw-esp32c5.bin }
          - { chip: esp32c6, features: esp32c6, asset: wartui-node-fw-esp32c6.bin }
          - chip: esp32c6
            features: esp32c6,xiao-external-antenna
            asset: wartui-node-fw-esp32c6-xiao.bin

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      # The same check `firmware-node.yml` makes, for the same reason: a second copy of any of
      # these builds, or fails to link, or panics on a board.
      - name: One copy of each esp-radio-pinned crate
        run: |
          pushd firmware/node
          resolved=$(cargo tree --locked --features ${{matrix.features}} -e normal \
            --prefix none --format '{p}' | awk '{print $1, $2}' | sort -u)
          for c in esp-alloc esp-hal esp-radio esp-rtos esp-sync esp-wifi-sys-${{matrix.chip}}; do
            n=$(printf '%s\n' "$resolved" | grep -c "^$c " || true)
            if [ "$n" != 1 ]; then
              printf '%s\n' "$resolved" | grep "^$c " || true
              echo "::error::$c resolves to $n versions, expected exactly 1"
              exit 1
            fi
          done
          popd

      - name: Build
        run: |
          pushd firmware/node
          cargo build --release --features ${{matrix.features}} --locked
          popd

      - name: Install espflash
        run: cargo install espflash --locked

      - name: Merge into one image
        run: |
          espflash save-image --skip-update-check --chip ${{matrix.chip}} --merge --skip-padding \
            firmware/node/target/riscv32imac-unknown-none-elf/release/wartui-node-fw \
            ${{matrix.asset}}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.asset}}
          path: ${{matrix.asset}}

  host:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }

    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{matrix.target}}

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Build
        env:
          WARTUI_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo build --release --locked -p wartui --target ${{matrix.target}}

      - name: Package
        run: |
          tar -C target/${{matrix.target}}/release -czf wartui-${{matrix.target}}.tar.gz wartui

      - uses: actions/upload-artifact@v4
        with:
          name: wartui-${{matrix.target}}.tar.gz
          path: wartui-${{matrix.target}}.tar.gz

  release:
    needs: [node, host]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
