name: Firmware - P4 radio

# Path-filtered: this builds only when something the P4 radio firmware compiles
# changes — its own sources, `firmware/common` and `crates/wartui-proto` (the
# path dependencies it compiles), `rustfmt.toml` (fmt resolves it from the repo
# root), or this file. One workflow per firmware because GitHub's path filter is
# workflow-wide, never per-job.

on:
  push:
    branches: ["main"]
    paths:
      - firmware/p4-radio/**
      - '!firmware/p4-radio/README.md'
      - firmware/common/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-p4-radio.yml
      - rustfmt.toml
  pull_request:
    paths:
      - firmware/p4-radio/**
      - '!firmware/p4-radio/README.md'
      - firmware/common/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-p4-radio.yml
      - rustfmt.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  p4-radio:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf

      - name: Lint
        run: |
          pushd firmware/p4-radio
          cargo fmt --all -- --check
          popd

      # Every crate `esp-radio` also depends on must resolve to exactly one
      # version: a second copy is a duplicate symbol under fat LTO or a second,
      # empty heap. `firmware/bridge/README.md` § "Dependency versions" has the
      # reasoning, and `firmware-bridge.yml` the same check.
      - name: One copy of each esp-radio-pinned crate
        run: |
          pushd firmware/p4-radio
          resolved=$(cargo tree --locked --features esp32c6 -e normal \
            --prefix none --format '{p}' | awk '{print $1, $2}' | sort -u)
          for c in esp-alloc esp-hal esp-radio esp-rtos esp-storage esp-sync esp-wifi-sys-esp32c6; do
            n=$(printf '%s\n' "$resolved" | grep -c "^$c " || true)
            if [ "$n" != 1 ]; then
              printf '%s\n' "$resolved" | grep "^$c " || true
              echo "::error::$c resolves to $n versions, expected exactly 1"
              exit 1
            fi
          done
          popd

      - name: Build
        run: |
          pushd firmware/p4-radio
          cargo build --release --features esp32c6 --locked --verbose
          popd

      - name: Clippy
        run: |
          pushd firmware/p4-radio
          cargo clippy --release --features esp32c6 --locked -- -D warnings
          popd
