name: Build & Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Lint
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --all-targets --all-features --locked --verbose

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked --verbose

  firmware:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Lint bridge firmware
        run: |
          pushd firmware/bridge
          cargo fmt --all -- --check
          popd

      - name: Lint node firmware
        run: |
          pushd firmware/node
          cargo fmt --all -- --check
          popd

      - name: Build bridge firmware
        run: |
          pushd firmware/bridge
          cargo build --release --features esp32c5 --locked --verbose
          cargo build --release --features esp32c6 --locked --verbose
          cargo clippy --all-targets --features esp32c5 --locked -- -D warnings
          cargo clippy --all-targets --features esp32c6 --locked -- -D warnings
          popd

      - name: Build node firmware
        run: |
          pushd firmware/node
          cargo build --release --features esp32c5 --locked --verbose
          cargo build --release --features esp32c6 --locked --verbose
          cargo clippy --release --all-targets --features esp32c5 --locked -- -D warnings
          cargo clippy --release --all-targets --features esp32c6 --locked -- -D warnings
          popd
