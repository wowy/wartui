name: Firmware - Bridge

# Path-filtered: this builds only when something the bridge firmware compiles
# changes — its own sources, `firmware/common` and `crates/wartui-proto` (the
# path dependencies both firmwares compile; a wire change is a firmware change),
# `rustfmt.toml` (fmt resolves it from the repo root), or this file. One workflow
# per firmware because GitHub's path filter is workflow-wide, never per-job.
# PRs build one image per chip, while pushes to main and a manual run with
# "full" ticked build every board variant. Push builds still honour the path
# filters, while a manual run always builds.

on:
  push:
    branches: ["main"]
    paths:
      - firmware/bridge/**
      - '!firmware/bridge/README.md'
      - firmware/common/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-bridge.yml
      - rustfmt.toml
  pull_request:
    paths:
      - firmware/bridge/**
      - '!firmware/bridge/README.md'
      - firmware/common/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-bridge.yml
      - rustfmt.toml
  workflow_dispatch:
    inputs:
      full:
        description: Build every board variant, not just one per chip
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  bridge:
    strategy:
      # PRs build only the bare image per chip, so code behind the board
      # features is compiled on pushes to main and on a manual run with "full"
      # ticked. A PR that touches it can tick "full".
      matrix:
        features: >-
          ${{ fromJSON((github.event_name == 'push' || inputs.full)
          && '["esp32c5", "esp32c5,t-dongle-c5", "esp32c5,t-dongle-c5-gps",
          "esp32c5,t-dongle-c5,t-dongle-c5-gps", "esp32c6",
          "esp32c6,xiao-external-antenna"]'
          || '["esp32c5","esp32c6"]') }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Lint
        run: |
          pushd firmware/bridge
          cargo fmt --all -- --check
          popd

      # Every crate `esp-radio` also depends on must resolve to exactly one
      # version. A second copy is not an upgrade: two `esp-wifi-sys-*` export
      # `__esp_radio_printf` and `lto = "fat"` refuses the build, while a second
      # `esp-alloc` is a second and empty heap that shows up only on a board.
      # Ahead of the build, so the duplicate is named rather than left to come
      # back as a linker error. `firmware/bridge/README.md` § "Dependency
      # versions" has the reasoning; `.github/dependabot.yml` is what keeps the
      # bumps from arriving.
      - name: One copy of each esp-radio-pinned crate
        env:
          FEATURES: ${{matrix.features}}
        run: |
          chip=${FEATURES%%,*}  # the chip is always the first feature
          # `cargo tree` only resolves and compiles nothing, so the widest C5
          # feature set costs seconds and keeps the panel crates' check on PRs.
          tree_features=$FEATURES
          [ "$chip" = esp32c5 ] && tree_features=esp32c5,t-dongle-c5,t-dongle-c5-gps
          pushd firmware/bridge
          resolved=$(cargo tree --locked --features "$tree_features" -e normal \
            --prefix none --format '{p}' | awk '{print $1, $2}' | sort -u)
          for c in esp-alloc esp-hal esp-radio esp-rtos esp-sync esp-wifi-sys-$chip; do
            n=$(printf '%s\n' "$resolved" | grep -c "^$c " || true)
            if [ "$n" != 1 ]; then
              printf '%s\n' "$resolved" | grep "^$c " || true
              echo "::error::$c resolves to $n versions, expected exactly 1"
              exit 1
            fi
          done
          # Not in the loop above, because two lines is the right answer here and
          # one would be wrong: `embedded-hal` 0.2 is a different crate that has
          # always coexisted with 1.x. It is checked at all because the panel's
          # three crates sit on 1.0 and `esp-hal` brings it too, so a second copy
          # of *that* would be the same class of problem as a second `esp-hal`.
          n=$(printf '%s\n' "$resolved" | grep -c '^embedded-hal v1' || true)
          if [ "$n" != 1 ]; then
            printf '%s\n' "$resolved" | grep '^embedded-hal ' || true
            echo "::error::embedded-hal 1.x resolves to $n versions, expected exactly 1"
            exit 1
          fi
          popd

      - name: Build
        env:
          FEATURES: ${{matrix.features}}
        run: |
          pushd firmware/bridge
          cargo build --release --features "$FEATURES" --locked --verbose
          popd

      - name: Clippy
        env:
          FEATURES: ${{matrix.features}}
        run: |
          pushd firmware/bridge
          cargo clippy --release --features "$FEATURES" --locked -- -D warnings
          popd
