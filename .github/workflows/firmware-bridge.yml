name: Firmware - Bridge

# Path-filtered: this builds only when something the bridge firmware compiles
# changes — its own sources, `crates/wartui-proto` (the path dependency both
# firmwares compile; a wire change is a firmware change), `rustfmt.toml` (fmt
# resolves it from the repo root), or this file. One workflow per firmware
# because GitHub's path filter is workflow-wide, never per-job.

on:
  push:
    branches: ["main"]
    paths:
      - firmware/bridge/**
      - '!firmware/bridge/README.md'
      - crates/wartui-proto/**
      - .github/workflows/firmware-bridge.yml
      - rustfmt.toml
  pull_request:
    paths:
      - firmware/bridge/**
      - '!firmware/bridge/README.md'
      - crates/wartui-proto/**
      - .github/workflows/firmware-bridge.yml
      - rustfmt.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  bridge:
    strategy:
      matrix:
        target: [esp32c5, esp32c6]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Lint
        run: |
          pushd firmware/bridge
          cargo fmt --all -- --check
          popd

      # Every crate `esp-radio` also depends on must resolve to exactly one
      # version. A second copy is not an upgrade: two `esp-wifi-sys-*` export
      # `__esp_radio_printf` and `lto = "fat"` refuses the build, while a second
      # `esp-alloc` is a second and empty heap that shows up only on a board.
      # Ahead of the build, so the duplicate is named rather than left to come
      # back as a linker error. `firmware/bridge/README.md` § "Dependency
      # versions" has the reasoning; `.github/dependabot.yml` is what keeps the
      # bumps from arriving.
      - name: One copy of each esp-radio-pinned crate
        run: |
          pushd firmware/bridge
          resolved=$(cargo tree --locked --features ${{matrix.target}} -e normal \
            --prefix none --format '{p}' | awk '{print $1, $2}' | sort -u)
          for c in esp-alloc esp-hal esp-radio esp-rtos esp-sync esp-wifi-sys-${{matrix.target}}; do
            n=$(printf '%s\n' "$resolved" | grep -c "^$c " || true)
            if [ "$n" != 1 ]; then
              printf '%s\n' "$resolved" | grep "^$c " || true
              echo "::error::$c resolves to $n versions, expected exactly 1"
              exit 1
            fi
          done
          popd

      - name: Build
        run: |
          pushd firmware/bridge
          cargo build --release --features ${{matrix.target}} --locked --verbose
          popd

      - name: Clippy
        run: |
          pushd firmware/bridge
          cargo clippy --release --features ${{matrix.target}} --locked -- -D warnings
          popd
