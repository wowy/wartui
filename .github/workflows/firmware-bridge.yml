name: Firmware - Bridge

# Path-filtered: this builds only when something the bridge firmware compiles
# changes — its own sources, `crates/wartui-proto` (the path dependency both
# firmwares compile; a wire change is a firmware change), `rustfmt.toml` (fmt
# resolves it from the repo root), or this file. One workflow per firmware
# because GitHub's path filter is workflow-wide, never per-job.

on:
  push:
    branches: ["main"]
    paths:
      - firmware/bridge/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-bridge.yml
      - rustfmt.toml
  pull_request:
    paths:
      - firmware/bridge/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-bridge.yml
      - rustfmt.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  bridge:
    strategy:
      matrix:
        target: [esp32c5, esp32c6]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Lint
        run: |
          pushd firmware/bridge
          cargo fmt --all -- --check
          popd

      - name: Build
        run: |
          pushd firmware/bridge
          cargo build --release --features ${{matrix.target}} --locked --verbose
          popd

      - name: Clippy
        run: |
          pushd firmware/bridge
          cargo clippy --release --features ${{matrix.target}} --locked -- -D warnings
          popd

  s3-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32s3
          default: false
          override: false
          # `std` only; this firmware is `no_std`.
          ldproxy: false
          # Sets `xtensa-esp32s3-elf-gcc` on the PATH
          export: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Lint
        run: |
          pushd firmware/bridge
          cargo +esp fmt --all -- --check
          popd

      - name: Build
        run: |
          pushd firmware/bridge
          cargo +esp build --release --features esp32s3 --target xtensa-esp32s3-none-elf --locked --verbose
          popd

      - name: Clippy
        run: |
          pushd firmware/bridge
          cargo +esp clippy --release --features esp32s3 --target xtensa-esp32s3-none-elf --locked -- -D warnings
          popd
