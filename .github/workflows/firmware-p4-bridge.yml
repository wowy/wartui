name: Firmware - P4 bridge

# Path-filtered: this builds only when something the P4 bridge firmware compiles
# changes — its own sources, `firmware/common` and `crates/wartui-proto` (the
# path dependencies it compiles), `rustfmt.toml` (fmt resolves it from the repo
# root), or this file. One workflow per firmware because GitHub's path filter is
# workflow-wide, never per-job.

on:
  push:
    branches: ["main"]
    paths:
      - firmware/p4-bridge/**
      - '!firmware/p4-bridge/README.md'
      - firmware/common/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-p4-bridge.yml
      - rustfmt.toml
  pull_request:
    paths:
      - firmware/p4-bridge/**
      - '!firmware/p4-bridge/README.md'
      - firmware/common/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-p4-bridge.yml
      - rustfmt.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  p4-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imafc-unknown-none-elf

      - name: Lint
        run: |
          pushd firmware/p4-bridge
          cargo fmt --all -- --check
          popd

      - name: Build
        run: |
          pushd firmware/p4-bridge
          cargo build --release --locked --verbose
          cargo build --release --locked --verbose --no-default-features
          popd

      - name: Clippy
        run: |
          pushd firmware/p4-bridge
          cargo clippy --release --locked -- -D warnings
          cargo clippy --release --locked --no-default-features -- -D warnings
          popd
