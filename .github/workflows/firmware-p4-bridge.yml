name: Firmware - P4 bridge

# Path-filtered: this builds only when something the P4 bridge firmware compiles
# changes — its own sources, `firmware/p4-radio` (the C6 image its build script
# builds and embeds), `firmware/common` and `crates/wartui-proto` (the path
# dependencies both compile), `rustfmt.toml` (fmt resolves it from the repo
# root), or this file. One workflow per firmware because GitHub's path filter is
# workflow-wide, never per-job.

on:
  push:
    branches: ["main"]
    paths:
      - firmware/p4-bridge/**
      - '!firmware/p4-bridge/README.md'
      - firmware/p4-radio/**
      - '!firmware/p4-radio/README.md'
      - firmware/common/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-p4-bridge.yml
      - rustfmt.toml
  pull_request:
    paths:
      - firmware/p4-bridge/**
      - '!firmware/p4-bridge/README.md'
      - firmware/p4-radio/**
      - '!firmware/p4-radio/README.md'
      - firmware/common/**
      - crates/wartui-proto/**
      - .github/workflows/firmware-p4-bridge.yml
      - rustfmt.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  p4-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # The C6's target too: `build.rs` builds `firmware/p4-radio` and saves its
      # image with espflash, for every build and clippy run below.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imafc-unknown-none-elf,riscv32imac-unknown-none-elf

      - uses: taiki-e/install-action@v2
        with:
          tool: espflash@4.6.0

      - name: Lint
        run: |
          pushd firmware/p4-bridge
          cargo fmt --all -- --check
          popd

      # The check `firmware-node.yml` makes, for the crates the P4 links: it has no radio and no
      # allocator. Ahead of the build, so a duplicate is named rather than left to come back as a
      # linker error or a panic on a board. `.github/dependabot.yml` is what keeps the bumps from
      # arriving.
      - name: One copy of each pinned crate
        run: |
          pushd firmware/p4-bridge
          resolved=$(cargo tree --locked -e normal --prefix none --format '{p}' \
            | awk '{print $1, $2}' | sort -u)
          for c in esp-hal esp-rtos esp-storage esp-sync; do
            n=$(printf '%s\n' "$resolved" | grep -c "^$c " || true)
            if [ "$n" != 1 ]; then
              printf '%s\n' "$resolved" | grep "^$c " || true
              echo "::error::$c resolves to $n versions, expected exactly 1"
              exit 1
            fi
          done
          popd

      - name: Build
        run: |
          pushd firmware/p4-bridge
          cargo build --release --locked --verbose
          popd

      - name: Clippy
        run: |
          pushd firmware/p4-bridge
          cargo clippy --release --locked -- -D warnings
          popd
