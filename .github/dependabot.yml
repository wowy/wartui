version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"

  # The firmwares are their own workspaces, and every crate `esp-radio` also
  # depends on is held at the version `esp-radio` resolves. Bumping one out of
  # that range does not upgrade it, it adds a second copy: `__esp_radio_printf`
  # multiply defined under `lto = "fat"` for `esp-wifi-sys-*`, a second and empty
  # heap for `esp-alloc`. A new `esp-radio` moves the whole family at once, by
  # hand. `esp-radio` itself is deliberately not ignored — a pull request there
  # is the signal that the set can move.
  # The same holds for the crates `esp-rtos` and `esp-hal` themselves build
  # against: `embassy-executor`, `embassy-sync`, `embassy-time`, `embedded-io-async`.
  # And for `esp-bootloader-esp-idf`, which fixes the `esp-storage` version.
  # `firmware/bridge/README.md` § "Dependency versions" has the reasoning.
  - package-ecosystem: "cargo"
    directories:
      - "/firmware/bridge"
      - "/firmware/node"
      - "/firmware/common"
    schedule:
      interval: "daily"
    # Minor and major only, which for a 0.x crate is the whole of what is
    # semver-incompatible. A patch release stays inside what `esp-radio` asks
    # for, so it moves the one copy rather than adding a second, and each
    # firmware's CI job counts the versions before it builds. Those are worth
    # taking — an `esp-hal` patch release is a fix this firmware can have.
    ignore:
      - dependency-name: "embassy-executor"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "embassy-sync"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "embassy-time"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "embedded-io-async"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-alloc"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-bootloader-esp-idf"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-hal"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-rtos"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-storage"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-sync"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-wifi-sys-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
