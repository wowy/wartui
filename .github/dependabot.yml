version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    # `colorgrad` is held at the version `tui-bar-graph` resolves. Its only use is
    # the gradient handed to `BarGraph::with_gradient`, which takes the `Gradient`
    # trait of `tui-bar-graph`'s own copy. A higher one is a second copy rather
    # than an upgrade, and its gradients do not implement that trait (E0277 in
    # `crates/wartui/src/tui/chart.rs`). `tui-bar-graph` itself is deliberately
    # not ignored — a pull request there is the signal that the two can move,
    # together and by hand. Patch releases move the one copy, so they stay.
    ignore:
      - dependency-name: "colorgrad"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # The firmwares are their own workspaces, and every crate `esp-radio` also
  # depends on is held at the version `esp-radio` resolves. Bumping one out of
  # that range does not upgrade it, it adds a second copy: `__esp_radio_printf`
  # multiply defined under `lto = "fat"` for `esp-wifi-sys-*`, a second and empty
  # heap for `esp-alloc`. A new `esp-radio` moves the whole family at once, by
  # hand. `esp-radio` itself is deliberately not ignored — a pull request there
  # is the signal that the set can move.
  # The same holds for the crates `esp-rtos` and `esp-hal` themselves build
  # against: `embassy-executor`, `embassy-futures`, `embassy-sync`, `embassy-time`,
  # `embedded-io-async`.
  # And for `esp-bootloader-esp-idf`, which fixes the `esp-storage` version.
  # `firmware/p4-bridge` has no `esp-radio` of its own and is held to the same set,
  # because it builds against the same `firmware/common`.
  # `bt-hci` is held the same way, at the version `trouble-host` resolves: the C6
  # names it beside `trouble-host`, and a higher one is a second copy whose types
  # `trouble-host`'s API does not take (E0308 in `firmware/p4-radio/src/ble.rs`).
  # `trouble-host` itself is deliberately not ignored — a pull request there is
  # the signal that the two can move, and that the copy vendored in
  # `firmware/p4-radio/vendor/trouble-host` can go.
  # The six crates that copy's `security` feature names are held with it: `aes`,
  # `cmac`, `p256`, `rand`, `rand_chacha` and `rand_core`. Dependabot reads the
  # copy's `Cargo.toml` as one of the C6's manifests, so a minor or major release
  # of one arrives as an edit to a copy that takes no change. Its source is
  # written against the versions it names: `rand_chacha` 0.10 implements
  # `rand_core` 0.10's traits, and the copy's security manager asks for 0.6's.
  # Drop these six entries with the copy.
  # `firmware/p4-radio/README.md` § "Dependency versions" has the reasoning.
  - package-ecosystem: "cargo"
    directories:
      - "/firmware/node"
      - "/firmware/p4-radio"
      - "/firmware/p4-bridge"
      - "/firmware/common"
    schedule:
      interval: "daily"
    # Minor and major only, which for a 0.x crate is the whole of what is
    # semver-incompatible. A patch release stays inside what `esp-radio` asks
    # for, so it moves the one copy rather than adding a second, and each
    # firmware's CI job counts the versions before it builds. Those
    # are worth taking — an `esp-hal` patch release is a fix this firmware can have.
    ignore:
      - dependency-name: "aes"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "bt-hci"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "cmac"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "embassy-executor"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "embassy-futures"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "embassy-sync"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "embassy-time"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "embedded-io-async"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-alloc"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-bootloader-esp-idf"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-hal"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-rtos"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-storage"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-sync"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "esp-wifi-sys-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "p256"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "rand_chacha"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "rand_core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
