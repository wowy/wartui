; Builds the ESP32DualBandWardriver firmware for an ESP32-C5.
;
; The upstream project builds with arduino-cli in CI and ships no PlatformIO
; project. This reproduces that build using the toolchain wartui already needs,
; rather than a second ~2 GB arduino-cli install. Library versions are pinned to
; the exact refs .github/workflows/wardriver_build_parallel.yml checks out, and
; build.sh vendors them into lib/ rather than declaring lib_deps -- the Adafruit
; ST7735 package declares `depends=... SD`, which drags in the AVR SD library
; and shadows the ESP32 core's own.
;
; Driven by build.sh; running `pio run` here directly will not have a src/.

[env:c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_unflags = -Werror=all
build_flags =
  -DC5_WARDRIVER
; CI compiles with `--warnings none`. This codebase does not build warning-clean
; and pioarduino promotes warnings to errors by default.
  -w
  -Wno-error
; The upstream CI patches platform.txt to add this; duplicate symbols across the
; sketch's translation units do not link without it.
  -Wl,-zmuldefs
; The core's SD library includes ff.h, diskio_impl.h and friends from the IDF's
; FATFS component, which are not on the include path by default here.
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32c5/include/fatfs/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32c5/include/fatfs/diskio
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32c5/include/fatfs/vfs
