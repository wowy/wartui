# Its own workspace: a Bluetooth stack and its dependencies have no place in the host crates'
# lockfile, and the spike never merges.
[workspace]

[package]
name = "ble-standin"
description = "Spike only: a PC stand-in for a phone host on the wartui Bluetooth link."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
# btleplug's BlueZ backend links libdbus. Vendored, so the build needs no `dbus-devel`.
dbus = { version = "0.9.12", features = ["vendored"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = "1.29.2"
wartui-proto = { path = "../../crates/wartui-proto" }
