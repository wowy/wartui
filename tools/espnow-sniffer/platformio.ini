; Phase 0 sniffer. PlatformIO's upstream espressif32 platform does not carry
; ESP32-C5 or C6 Arduino cores, so this uses the pioarduino fork, which tracks
; arduino-esp32 3.x (the same generation the wardriver firmware builds against).
; 55.03.39 is the first release carrying ESP32-C5 board definitions; earlier
; ones build for C6 and S3 but reject esp32-c5-devkitc-1 as an unknown board.
;
;   pio run -e c6 -t upload && pio device monitor -b 115200
;
; If the platform fetch is a problem, arduino-cli builds this sketch too — that
; is what the wardriver repo's own CI uses:
;
;   arduino-cli core install esp32:esp32@3.3.0
;   arduino-cli compile --fqbn esp32:esp32:esp32c6 tools/espnow-sniffer
;   arduino-cli upload  --fqbn esp32:esp32:esp32c6 -p /dev/cu.usbmodem* tools/espnow-sniffer

; The sketch sits at the project root rather than in src/ so that this stays a
; valid Arduino sketch directory (espnow-sniffer/espnow-sniffer.ino), which is
; what arduino-cli requires. src_dir points PlatformIO at it.
[platformio]
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

[env:c6]
board = esp32-c6-devkitc-1

[env:c5]
board = esp32-c5-devkitc-1

[env:s3]
board = esp32-s3-devkitc-1
