[package]
name = "wartui-bindgen"
description = "The UniFFI bindings generator that makes wartui-ffi's Kotlin and Swift."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
# The workspace's `uniffi`, which `wartui-ffi` builds on too. The generator reads `uniffi.toml`
# through `cargo metadata`.
uniffi = { workspace = true, features = ["cli", "cargo-metadata"] }
