[package]
name = "wartui-bindgen"
description = "The UniFFI bindings generator that makes wartui-ffi's Kotlin and Swift."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
# The version `wartui-ffi` names, so the generator reads the metadata that library embeds. It
# reads `uniffi.toml` through `cargo metadata`.
uniffi = { version = "0.32.2", default-features = false, features = ["cli", "cargo-metadata"] }
