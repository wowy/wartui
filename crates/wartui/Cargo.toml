[package]
name = "wartui"
description = "Terminal fleet controller for ESP32-C5 wardriving nodes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "wartui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "multipart"] }
wartui-bridge = { path = "../wartui-bridge" }
wartui-core = { path = "../wartui-core" }
wartui-proto = { path = "../wartui-proto" }

[dev-dependencies]
tempfile = "3.27.0"
