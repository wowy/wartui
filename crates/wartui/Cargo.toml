[package]
name = "wartui"
description = "Terminal fleet controller for ESP32-C5 wardriving nodes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "wartui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wartui-bridge = { path = "../wartui-bridge" }
wartui-core = { path = "../wartui-core" }
wartui-proto = { path = "../wartui-proto" }
