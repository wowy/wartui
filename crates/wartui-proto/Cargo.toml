[package]
name = "wartui-proto"
description = "Wire formats and node logic for the wartui ESP32-C5/C6 wardriver mesh, shared by the host and both firmwares."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cobs = { version = "0.5.1", default-features = false }
heapless = { version = "0.9.3", default-features = false, features = ["serde"] }
nb = "1.1.0"
postcard = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
cobs = { version = "0.5.1", default-features = false }
