# What the generated bindings are called. `smoke/run.sh` and a phone app's build read the same.
[bindings.kotlin]
package_name = "racing.deadbear.wartui.core"

# Every Kotlin object is `AutoCloseable`, whose `close()` frees the handle, so `Link::close`
# would clash with it. Kotlin nests an error's or an enum's variants in its class, where a variant
# hides the type of the same name its field holds: `SettingsError::Invalid` hides `Invalid`,
# `SiteRefusal::Missing` hides `Missing` and `Waited::Unfollowed` hides `Unfollowed`. So those
# types are renamed, in Swift too so both languages call them the same.
[bindings.kotlin.rename]
"Link.close" = "disconnect"
"Invalid" = "BrokenRule"
"Missing" = "MissingCredentials"
"Unfollowed" = "JobUnfollowed"

[bindings.swift]
module_name = "WartuiCore"
ffi_module_name = "WartuiCoreFFI"

[bindings.swift.rename]
"Invalid" = "BrokenRule"
"Missing" = "MissingCredentials"
"Unfollowed" = "JobUnfollowed"
