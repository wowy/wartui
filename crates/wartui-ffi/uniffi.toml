# What the generated bindings are called. `smoke/run.sh` and a phone app's build read the same.
[bindings.kotlin]
package_name = "racing.deadbear.wartui.core"

# Every Kotlin object is `AutoCloseable`, whose `close()` frees the handle, so `Link::close`
# would clash with it. Kotlin nests an error's variants in its exception class, where the variant
# `SettingsError::Invalid` hides the type `Invalid` its `reason` field names, so the type is
# `BrokenRule`, in Swift too so both languages call it the same.
[bindings.kotlin.rename]
"Link.close" = "disconnect"
"Invalid" = "BrokenRule"

[bindings.swift]
module_name = "WartuiCore"
ffi_module_name = "WartuiCoreFFI"

[bindings.swift.rename]
"Invalid" = "BrokenRule"
