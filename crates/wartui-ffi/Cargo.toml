[package]
name = "wartui-ffi"
description = "The UniFFI binding a wartui phone app loads: the app layer's captures, settings and Bluetooth link, for Kotlin and Swift."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "wartui_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# The bindings generator, which reads `uniffi.toml` through `cargo metadata`.
cli = ["uniffi/cli", "uniffi/cargo-metadata"]
# `WireSim`, a simulated bridge at the byte level, for tests and the smoke programs. No shipped
# build enables it.
testing = []

[dependencies]
futures-util = "0.3.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
uniffi = { version = "0.32.2", default-features = false }
wartui-app = { path = "../wartui-app" }
wartui-bridge = { path = "../wartui-bridge" }
wartui-core = { path = "../wartui-core" }
wartui-proto = { path = "../wartui-proto" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
# The crate's own tests drive `WireSim`, so `cargo test --workspace` builds them with it.
wartui-ffi = { path = ".", features = ["testing"] }
