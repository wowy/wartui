[package]
name = "wartui-app"
description = "The headless app layer a wartui front end binds to: its settings, the captures it runs, and what it asks a bridge between them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Fixtures for upload and update tests, here and in `wartui`: captures to send and a local
# listener to send them to, so no test reaches a real site, and app images that pass every
# check. No shipped build enables it.
testing = []

[dependencies]
# The version `ureq` resolves, so the lockfile holds one copy; WiGLE's Basic auth.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
flate2 = "1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
toml = "1"
tracing = "0.1.44"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "multipart"] }
wartui-bridge = { path = "../wartui-bridge" }
wartui-core = { path = "../wartui-core" }
wartui-proto = { path = "../wartui-proto" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util", "time"] }
