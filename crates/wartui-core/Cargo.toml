[package]
name = "wartui-core"
description = "Fleet engine, observation store and WiGLE export for the ESP32-C5 wardriver mesh."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serialport = "4.10.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
wartui-bridge = { path = "../wartui-bridge" }
wartui-proto = { path = "../wartui-proto" }

[dev-dependencies]
tempfile = "3.24.0"
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt-multi-thread"] }
