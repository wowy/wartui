[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wowy/wartui"

# The binding and its generator name one `uniffi`: the generator reads the metadata the library
# embeds.
[workspace.dependencies]
uniffi = { version = "0.32.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
