# Its own workspace, for the reasons `firmware/node` is one: a different target, a
# different toolchain pin and a lockfile that must not be resolved together with the
# host crates.
[workspace]

[package]
name = "wartui-p4-bridge-fw"
description = "The host half of the wartui P4 split bridge: a UART link to the host through the board's CH343, and one to the ESP32-P4-WIFI6's ESP32-C6."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wowy/wartui"

[[bin]]
name = "wartui-p4-bridge-fw"
path = "src/main.rs"
test = false
bench = false

[dependencies]
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32p4"] }
esp-hal = { version = "1.2.2", features = ["esp32p4", "unstable"] }
# The executor and time driver. No allocator: nothing here spawns a thread or allocates.
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32p4"] }
# `embassy-executor`, `embassy-futures`, `embassy-sync` and `embassy-time` stay at the minor
# versions `esp-hal` and `esp-rtos` build against; Dependabot takes only their patch releases.
# `firmware/p4-radio/README.md` § "Dependency versions" has the reasoning.
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
static_cell = "2.1.1"
# The reset funnel, the reset cause and the phase marker, shared with the other
# bridges, the updates on flash the node and the C6 use, and the GPS reader for a u-blox
# receiver on I2C0, GPIO7 (SDA) and GPIO8 (SCL). No `radio`: the P4 has none.
wartui-firmware = { path = "../common", features = ["esp32p4", "gps", "ota"] }
wartui-proto = { path = "../../crates/wartui-proto" }

# `build.rs` builds the C6's image, then reads the digest appended to it and hashes it.
[build-dependencies]
sha2 = { version = "0.11.1", default-features = false }
wartui-proto = { path = "../../crates/wartui-proto" }

[lints.rust]
# AGENTS.md's project-wide rule; the root workspace excludes `firmware`, so it is
# stated here too.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

# The crates that encode and check every record and packet, built for speed as the
# other bridges build them.
[profile.release.package.wartui-proto]
opt-level = 3

[profile.release.package.postcard]
opt-level = 3
