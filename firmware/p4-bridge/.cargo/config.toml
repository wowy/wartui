[build]
target = "riscv32imafc-unknown-none-elf"
rustflags = [
  # Needed for usable backtraces out of a debugger.
  "-C", "force-frame-pointers",
]

[target.riscv32imafc-unknown-none-elf]
# The board's Type-C reaches the P4's UART0 through a CH343: `--port <that port>`. The P4's
# partition table, with two app slots and a trial sector; erasing `otadata` boots the image just
# written. `--flash-size 16mb` is the size the table needs and the one `flash-bridge` and the
# release name in their images: espflash writes it into the image's header, which the image's
# digest covers, so a board flashed here reports the digest `flash-bridge` builds from the same
# source. Left to detect it, espflash writes the board's 32 MB. No `--monitor`: the port carries
# the host link, not diagnostics, so the run ends once the image is written and frees the port.
runner = "espflash flash --chip esp32p4 --flash-size 16mb --partition-table partitions.csv --erase-parts otadata"
