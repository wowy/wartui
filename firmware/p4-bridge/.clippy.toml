# The messages this firmware moves are big by design and cannot be boxed: an allocator on the
# receive path is exactly what `wartui-proto` exists to avoid. A decoded `HostToBridge` inlines a
# 1029-byte record for a node, a `BridgeToHost` a 1024-byte record from one, and packing a node's
# queue into a transfer stages a 1044-byte transfer beside a 1032-byte entry.
#
# So the threshold is set above the size those force and well under the main task's stack.
# Anything this still catches is a frame nothing in the protocol accounts for, and worth reading.
stack-size-threshold = 5120
