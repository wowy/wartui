[build]
target = "riscv32imac-unknown-none-elf"
rustflags = [
  # Needed for usable backtraces out of a debugger.
  "-C", "force-frame-pointers",
]

[target.riscv32imac-unknown-none-elf]
# Flashed through header H4 with IO9 jumpered to GND and the P4 parked in its ROM, so
# nothing may toggle a reset line: pass `--port <the USB-to-TTL adapter>`. The partition
# table path is relative to where cargo runs, so `cargo run` works from this directory.
# otadata is erased so the bootloader boots ota_0, where the app goes, whatever slot an
# update from the P4 last selected. The flash mode, frequency and size go into the image
# header, which the image's digest covers, so they match the image `firmware/p4-bridge/build.rs`
# bundles: left to detection, a C6 with other flash would get another digest and be reflashed.
runner = "espflash flash --before no-reset --after no-reset --partition-table partitions.csv --erase-parts otadata --flash-mode dio --flash-freq 40mhz --flash-size 4mb"

[env]
# TrouBLE's packet pool: an L2CAP PDU of 521 bytes carries the largest ATT MTU, 517, which
# leaves 514 bytes of host stream in each notification. The pool's 16 packets are 8.3 KB of
# static RAM. Read by `trouble-host`'s build script.
TROUBLE_HOST_DEFAULT_PACKET_POOL_MTU = "521"
