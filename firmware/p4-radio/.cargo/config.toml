[build]
target = "riscv32imac-unknown-none-elf"
rustflags = [
  # Needed for usable backtraces out of a debugger.
  "-C", "force-frame-pointers",
]

[target.riscv32imac-unknown-none-elf]
# Flashed through header H7 with IO9 jumpered to GND and the P4 parked in its ROM, so
# nothing may toggle a reset line: pass `--port <the USB-to-TTL adapter>`. The partition
# table path is relative to where cargo runs, so `cargo run` works from this directory.
# otadata is erased so the bootloader boots ota_0, where the app goes, whatever slot an
# update from the P4 last selected.
runner = "espflash flash --before no-reset --after no-reset --partition-table partitions.csv --erase-parts otadata"
