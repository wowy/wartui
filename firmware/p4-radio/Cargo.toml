# Its own workspace, for the reasons `firmware/node` is one: a different target, a
# different toolchain pin and a lockfile that must not be resolved together with the
# host crates.
[workspace]

[package]
name = "wartui-p4-radio-fw"
description = "The C6 half of the wartui P4 split bridge: the ESP32-P4-WIFI6's ESP32-C6, on a UART link to the P4."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wowy/wartui"

[[bin]]
name = "wartui-p4-radio-fw"
path = "src/main.rs"

[features]
# The Bluetooth host spike's discard sink: answer every `Down::HostBytes` with credit at once,
# and claim a subscriber after the hello exchange, so the P4 routes its host queue here with no
# Bluetooth present. For measuring the P4→C6 link's ceiling. `firmware/p4-bridge`'s feature of
# the same name builds the bundled image with it.
sink-discard = []

[dependencies]
# Every `esp-*` crate and `embassy-*` crate is held at the version `esp-radio` resolves,
# for the reasons `README.md` § "Dependency versions" gives. Each that takes a chip feature
# names the only one: the P4 boards carry an ESP32-C6.
# The Bluetooth controller allocates, and `esp-rtos` and `esp-radio` allocate through this
# copy's `HEAP`, so it is held at the version `esp-radio` resolves, as the node holds it. The
# heap stats give `BleStats` its high-water mark.
esp-alloc = { version = "0.11.0", features = ["esp32c6", "internal-heap-stats"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }
esp-hal = { version = "1.2.2", features = ["esp32c6", "unstable"] }
# The node's `esp-radio`, with Bluetooth alone: the controller behind TrouBLE.
esp-radio = { version = "1.0.0-beta.1", default-features = false, features = [
  "ble",
  "esp-alloc",
  "esp32c6",
  "unstable",
] }
# The executor and time driver, and the scheduler the radio runs on.
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32c6"] }
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
# The Bluetooth host. 0.8 builds on `bt-hci` 0.10, whose transport trait lives in
# `bt-hci-transport`, the crate `esp-radio`'s `BleConnector` implements it from, so the
# connector plugs in as it is. `bt-hci` resolves twice, 0.9 for `esp-radio` and 0.10 here:
# plain types with no global symbols. The packet pool's size is in `.cargo/config.toml`.
bt-hci = { version = "0.10.1", default-features = false }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
trouble-host = { version = "0.8.0", default-features = false, features = [
  "connection-params-update",
  "default-packet-pool",
  "derive",
  "gatt",
  "peripheral",
] }
static_cell = "2.1.1"
# The reset funnel, the reset cause and the phase marker, shared with the P4, and the flash
# half of updates, shared with the node, which brings `esp-storage` at the version
# `firmware/common/Cargo.toml` holds.
wartui-firmware = { path = "../common", features = ["esp32c6"] }
wartui-proto = { path = "../../crates/wartui-proto" }

[lints.rust]
# AGENTS.md's project-wide rule; the root workspace excludes `firmware`, so it is
# stated here too.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
# The debug profile is too big.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

# The crates that encode and check every record and packet, built for speed.
[profile.release.package.wartui-proto]
opt-level = 3

[profile.release.package.postcard]
opt-level = 3
