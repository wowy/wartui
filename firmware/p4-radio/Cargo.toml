# Its own workspace, for the reasons `firmware/node` is one: a different target, a
# different toolchain pin and a lockfile that must not be resolved together with the
# host crates.
[workspace]
exclude = ["vendor"]

[package]
name = "wartui-p4-radio-fw"
description = "The C6 half of the wartui P4 split bridge: the ESP32-P4-WIFI6's ESP32-C6, on a UART link to the P4."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wowy/wartui"

[[bin]]
name = "wartui-p4-radio-fw"
path = "src/main.rs"

[dependencies]
# Every `esp-*` crate and `embassy-*` crate is held at the version `esp-radio` resolves,
# for the reasons `README.md` § "Dependency versions" gives. Each that takes a chip feature
# names the only one: the P4 boards carry an ESP32-C6.
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }
# The Bluetooth controller allocates, and `esp-rtos` and `esp-radio` allocate through this
# copy's `HEAP`, so it is held at the version `esp-radio` resolves, as the node holds it. The
# heap stats give `BleCounters` its high-water mark.
esp-alloc = { version = "0.11.0", features = ["esp32c6", "internal-heap-stats"] }
esp-hal = { version = "1.2.2", features = ["esp32c6", "unstable"] }
# The node's `esp-radio`, with Bluetooth alone: the controller behind TrouBLE.
esp-radio = { version = "1.0.0-beta.1", default-features = false, features = [
  "ble",
  "esp-alloc",
  "esp32c6",
  "unstable",
] }
# The executor and time driver, and the scheduler the radio runs on.
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32c6"] }
# TrouBLE's own copy, named for what its API does not re-export: `LeSetExtAdvEnable`, the
# command that stops every advertising set when a central connects, and its `AdvSet`. Held at
# the version `trouble-host` resolves, so it adds no copy.
bt-hci = "0.11.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
# The last panic's text, kept across the reset: `esp-hal` marks only `portable-atomic`'s
# atomics as persistable.
portable-atomic = { version = "1.15.0", default-features = false }
static_cell = "2.1.1"
# The Bluetooth host: 0.8.0, vendored and moved to `bt-hci` 0.11 (the `[patch.crates-io]`
# entry at the end of this file, `vendor/trouble-host/VENDORED.md`). Its transport trait lives in
# `bt-hci-transport`, the crate `esp-radio`'s `BleConnector` implements it from, so the connector
# plugs in as it is. `bt-hci` resolves twice, 0.9 for `esp-radio` and 0.11 here: plain types with
# no global symbols.
#
# The packet pool works around two esp-radio bugs, until a release the held set accepts fixes
# them. It holds an L2CAP PDU of 186 bytes, an ATT MTU of 182, set by
# `TROUBLE_HOST_DEFAULT_PACKET_POOL_MTU` in `.cargo/config.toml`. At most 251, every notification
# fits one ACL packet at data length 251: esp-radio 1.0.0-beta.1 zeroes the high byte of every
# outgoing ACL header, which marks each fragment a start, so a central drops a fragmented
# notification and the stream stalls (`docs/c6-ble-host-findings.md`, "Workarounds a production
# build needs"). At 186, no central's packet reaches the 193 bytes the controller hands over as a
# chain, of which esp-radio copies only the first buffer (`docs/ble-host-link-findings.md`, "The
# host stop, found").
#
# `connection-params-update` stays off, by choice. Off, the controller answers a central's
# parameter request itself and never waits on the host. On, the host must answer every one, and
# TrouBLE drops a request that reaches a connection it has yet to accept or whose event queue is
# full, which ends the link at the link layer's 40 s timeout (`README.md` § "Bluetooth host
# link").
#
# `security` brings LE Secure Connections pairing and bonds, with `legacy-pairing` left off so
# nothing pairs below LE Secure Connections. It seeds its RNG from the controller's LeRand.
# `extended-advertising` brings the advertising sets, one per protocol a central connects on.
trouble-host = { version = "0.8.0", default-features = false, features = [
  "default-packet-pool",
  "derive",
  "extended-advertising",
  "gatt",
  "peripheral",
  "security",
] }
# The reset funnel, the reset cause and the phase marker, shared with the P4, and the flash
# half of updates, shared with the node, which brings `esp-storage` at the version
# `firmware/common/Cargo.toml` holds.
wartui-firmware = { path = "../common", features = ["esp32c6"] }
wartui-proto = { path = "../../crates/wartui-proto" }

[lints.rust]
# AGENTS.md's project-wide rule; the root workspace excludes `firmware`, so it is
# stated here too.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
# The debug profile is too big.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

# The crates that encode and check every record and packet, built for speed.
[profile.release.package.wartui-proto]
opt-level = 3

[profile.release.package.postcard]
opt-level = 3

# `trouble-host` 0.8.0 with upstream's move to `bt-hci` 0.11 applied, until a release
# builds on it. `vendor/trouble-host/VENDORED.md` has its provenance and when it goes.
[patch.crates-io]
trouble-host = { path = "vendor/trouble-host" }
