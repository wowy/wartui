# The packets this firmware moves are big by design and cannot be boxed: an allocator on the
# receive path is exactly what `wartui-proto` exists to avoid. An update chunk and the packet
# body around it are each over 1KB, and the receiver's sector buffer is 4KB, held in a static.
#
# So the threshold is the P4's, set above what those force and well under the main task's stack.
# Anything this still catches is a frame nothing in the protocol accounts for, and worth reading.
stack-size-threshold = 5120
