# The messages this firmware moves are big by design and cannot be boxed: an
# allocator on the receive path is exactly what `wartui-proto` exists to avoid. So
# `HostToBridge` inlines a 1470-byte ESP-NOW v2 send (see
# `docs/espnow-v2-findings.md`) and is 1488 bytes, `BridgeToHost` inlines a 1024-byte
# node frame and is 1048, and a decoded `Down` carries the first while the payload
# pool copies that payload again. A function that takes one and builds another is
# therefore over 4KB before it has done anything interesting.
#
# So the threshold is set above the size those messages force and well under the main
# task's stack. Anything this still catches is a frame nothing in the protocol accounts
# for, and worth reading.
stack-size-threshold = 5120
