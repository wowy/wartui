# The messages this firmware moves are big by design and cannot be boxed: an
# allocator on the receive path is exactly what `wartui-proto` exists to avoid,
# so `HostToBridge` inlines a 1470-byte ESP-NOW v2 send (see
# `docs/espnow-v2-findings.md`) and is 1488 bytes. `BridgeToHost` inlines a
# 1024-byte node frame and is 1048. A function that takes one and builds another
# is therefore over 4KB before it has done anything interesting: `take_link_byte`,
# which decodes one and hands `handle` a reference, measures 4436 bytes, and
# `forward`, which copies a received frame into one, 4340.
#
# So the threshold is set above the size those enums force and well under the
# main task's stack, the RAM the linker leaves over: 172KB on the C5, the tighter
# of the two. Anything this still catches is a frame nothing in the protocol
# accounts for, and worth reading.
stack-size-threshold = 5120
