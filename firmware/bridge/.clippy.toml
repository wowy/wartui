# The messages this firmware moves are big by design and cannot be boxed: an
# allocator on the receive path is exactly what `wartui-proto` exists to avoid,
# so `HostToBridge` inlines a 1470-byte ESP-NOW v2 send (see
# `docs/espnow-v2-findings.md`) and is 1488 bytes. `BridgeToHost` inlines a
# 250-byte received frame and is 276. A function that takes one and builds another
# is therefore over 3KB before it has done anything interesting: `take_link_byte`,
# which decodes one and hands `handle` a reference, measures 3664 bytes.
#
# So the threshold is set above the size those enums force and well under the
# main task's stack, which the linker sizes at 216KB — anything this still
# catches is a frame nothing in the protocol accounts for, and worth reading.
stack-size-threshold = 4096
