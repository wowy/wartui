# Its own workspace: a different target, a different toolchain pin and a
# lockfile that must not be resolved together with the host crates. The path
# dependency on wartui-proto reaches up into the other workspace, which is the
# whole reason those wire types are `no_std`.
[workspace]

[package]
name = "wartui-bridge-fw"
description = "USB ESP-NOW bridge firmware for wartui. Framing and radio calls, no protocol knowledge."
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/wowy/wartui"

[[bin]]
name = "wartui-bridge-fw"
path = "src/main.rs"

[features]
# Exactly one must be selected; src/main.rs enforces it.
esp32c5 = [
  "esp-alloc/esp32c5",
  "esp-bootloader-esp-idf/esp32c5",
  "esp-hal/esp32c5",
  "esp-radio/esp32c5",
  "esp-rtos/esp32c5",
  "dep:esp-wifi-sys-esp32c5",
  "wartui-firmware/esp32c5",
]
esp32c6 = [
  "esp-alloc/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-hal/esp32c6",
  "esp-radio/esp32c6",
  "esp-rtos/esp32c6",
  "dep:esp-wifi-sys-esp32c6",
  "wartui-firmware/esp32c6",
]

# A Seeed XIAO ESP32-C6 with an antenna on its U.FL connector. The board's RF
# switch otherwise stays on the onboard ceramic antenna and ignores anything
# plugged in. C6 only; `firmware/node/src/main.rs` has why.
xiao-external-antenna = []

# A LilyGO T-Dongle-C5: the same C5 in a USB-A shell, with an ST7735 panel on
# SPI2. A board fact layered over a chip feature, like the one above, and inert
# without it — a bridge built without this reports no panel and is sent no lines.
# C5 only, and mutually exclusive with `xiao-external-antenna`, which drives two
# of this board's display and USB pins; `src/main.rs` enforces both.
t-dongle-c5 = ["dep:embedded-graphics", "dep:embedded-hal-bus", "dep:mipidsi"]

# A GPS receiver on a T-Dongle-C5's Qwiic port: a u-blox M10 at I2C 0x42, on I2C0
# with SDA on GPIO11 and SCL on GPIO12. A board fact layered over a chip feature,
# like the two above, and independent of `t-dongle-c5`: either builds without the
# other. C5 only, and mutually exclusive with `xiao-external-antenna`; `src/main.rs`
# enforces both. `esp-hal`'s I2C master drives it; `embassy-sync` carries its bytes
# between the GPS task and `main`.
t-dongle-c5-gps = ["dep:embassy-sync"]

[dependencies]
# `esp-radio` and `esp-rtos` allocate their task stacks and the Wi-Fi driver's
# queues through their own copy's `HEAP`, which nothing here fills, so a second
# copy is a second and empty heap. Held at the version `esp-radio` resolves;
# README.md § "Dependency versions".
esp-alloc = "0.10.0"
esp-bootloader-esp-idf = "0.5.0"
esp-hal = { version = "1.1.2", features = ["unstable"] }
esp-radio = { version = "1.0.0-beta.0", default-features = false, features = [
  "esp-alloc",
  "esp-now",
  "unstable",
  "wifi",
] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio"] }
# `main` is an `esp-rtos` embassy task so the idle wait can end on USB and radio
# events. Held at the versions `esp-rtos` and `esp-hal` build against;
# README.md § "Dependency versions".
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
# The GPS task's channels to `main`. Held at the version `esp-hal` and `esp-rtos`
# use; README.md § "Dependency versions".
embassy-sync = { version = "0.8.0", optional = true }
embassy-time = "0.5.1"
embedded-io-async = "0.7.0"
# IDF's own bindings, for the one call `esp-radio` does not wrap —
# `esp_now_set_peer_rate_config`, in `set_peer_rate`. Held at the version
# `esp-radio` links; README.md § "Dependency versions".
esp-wifi-sys-esp32c5 = { version = "0.2.0", optional = true }
esp-wifi-sys-esp32c6 = { version = "0.2.0", optional = true }
# The panel, behind `t-dongle-c5`. Outside the `esp-radio` wall that holds the
# `esp-*` family — none of these is in its dependency closure — but not outside
# it entirely: all three sit on `embedded-hal` 1.0, which `esp-hal` also brings,
# and a second copy of *that* would be the same class of problem. README.md
# § "Dependency versions" has the check.
embedded-graphics = { version = "0.8.2", optional = true }
embedded-hal-bus = { version = "0.3.0", optional = true }
mipidsi = { version = "0.10.0", default-features = false, optional = true }
nb = "1.1.0"
portable-atomic = { version = "1.15.0", default-features = false }
static_cell = "2.1.1"
# The reset funnel and the reset cause, shared with the other firmware.
wartui-firmware = { path = "../common" }
wartui-proto = { path = "../../crates/wartui-proto" }

[lints.rust]
# Stated in AGENTS.md as a project-wide rule, but the root workspace excludes
# `firmware`, so until this line existed the firmwares were covered by the
# documentation and not by the compiler. `deny` rather than `forbid`,
# so that the few calls AGENTS.md lists can allow it.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
# The default debug profile is too slow and too big for a device with this much
# RAM, and the radio blobs misbehave below opt-level 2 regardless.
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

# The crates that encode every frame the bridge forwards, built for speed while the
# rest of the image stays small. The main loop pumps no USB while a frame encodes, so
# encode time is drain lost while a node bursts. On a C5 this took forwarding a full
# batch from ~270 µs to ~230 µs, for about 1 KB of image.
[profile.release.package.wartui-proto]
opt-level = 3

[profile.release.package.cobs]
opt-level = 3

[profile.release.package.postcard]
opt-level = 3
