[build]
target = "riscv32imac-unknown-none-elf"
rustflags = [
  # Needed for usable backtraces out of a debugger.
  "-C", "force-frame-pointers",
]

[target.riscv32imac-unknown-none-elf]
# No --chip: espflash detects it, so the same runner serves both features. The
# partition table path is relative to where cargo runs, so `cargo run` works from
# this directory.
runner = "espflash flash --monitor --partition-table partitions.csv"
