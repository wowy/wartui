# Its own workspace: a different
# target, a different toolchain pin and a lockfile that must not be resolved
# together with the host crates. The path dependency on wartui-proto reaches up
# into the other workspace, which is why the wire types — and now the beacon
# parser and the dedup ring — are `no_std`.
[workspace]

[package]
name = "wartui-node-fw"
description = "Wardriving node firmware for wartui. Sniffs, reports, and takes channel assignments."
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wowy/wartui"

[[bin]]
name = "wartui-node-fw"
path = "src/main.rs"

[dependencies]
# `esp-radio` and `esp-rtos` allocate their task stacks and the Wi-Fi driver's
# queues through their own copy's `HEAP`, which nothing here fills, so a second
# copy is a second and empty heap. Held at the version `esp-radio` resolves;
# `firmware/p4-radio/README.md` § "Dependency versions". Each `esp-*` crate that takes a chip
# feature names the only one, the ESP32-C5.
esp-alloc = { version = "0.11.0", features = ["esp32c5"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c5"] }
esp-hal = { version = "1.2.2", features = ["esp32c5", "unstable"] }
# Diagnostics on the USB serial port. Unlike the bridge, a node has no link
# protocol sharing that endpoint, so printing to it is free and is the only
# window into a device with no display. `jtag-serial` rather than `auto`,
# because these boards are USB and the alternative costs a runtime probe per
# line. `critical-section` is left off: nothing here prints from more than one
# task.
esp-println = { version = "0.18.0", default-features = false, features = [
  "esp32c5",
  "jtag-serial",
] }
esp-radio = { version = "1.0.0-beta.1", default-features = false, features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp32c5",
  "sniffer",
  "unstable",
  "wifi",
] }
esp-rtos = { version = "0.4.0", features = ["esp-alloc", "esp-radio", "esp32c5"] }
esp-sync = "0.3.0"
static_cell = "2.1.1"
# The reset funnel, the reset cause, and the flash half of over-the-air updates, which
# brings `esp-storage` at the version `firmware/common/Cargo.toml` holds.
wartui-firmware = { path = "../common", features = ["esp32c5"] }
wartui-proto = { path = "../../crates/wartui-proto" }

[lints.rust]
# Stated in AGENTS.md as a project-wide rule, but the root workspace excludes
# `firmware`, so until this line existed the firmwares were covered by the
# documentation and not by the compiler. `deny` rather than `forbid`,
# so that the few calls AGENTS.md lists can allow it.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
# The default debug profile is too slow and too big for a device with this much
# RAM, and the radio blobs misbehave below opt-level 2 regardless.
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
