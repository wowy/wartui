# Its own workspace, for the reasons the firmwares are: a different target, a
# different toolchain pin and a lockfile that must not be resolved together with
# the host crates. Being one also lets `cargo clippy` run from here, which is
# what lints this crate: a firmware's clippy compiles a path dependency outside
# its workspace without linting it.
[workspace]

[package]
name = "wartui-firmware"
description = "Chip-level code the wartui firmwares need: the reset funnel, the reset cause, the bridge's phase marker and radio half, and the node's health readings."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wowy/wartui"

[features]
# Exactly one chip must be selected; src/lib.rs enforces it with compile_error!.
# Each firmware forwards its own chip feature here.
esp32c5 = ["esp-hal/esp32c5", "esp-radio?/esp32c5"]
esp32c6 = ["esp-hal/esp32c6", "esp-radio?/esp32c6"]
# No radio of its own; src/lib.rs refuses it with `radio`.
esp32p4 = ["esp-hal/esp32p4"]

# The bridge's ESP-NOW half (`src/radio.rs`), for every firmware that owns a radio
# and bridges it.
radio = ["dep:embassy-futures", "dep:embassy-sync", "dep:esp-radio"]

[dependencies]
# The firmwares are held on esp-hal 1.2 by `esp-radio`'s `~1.2.0`; this crate
# does not depend on `esp-radio`, so it states that range itself. Without it, this
# workspace's own lockfile could move to 1.3 and its clippy would lint against an
# esp-hal neither firmware builds. `firmware/bridge/README.md` § "Dependency versions".
esp-hal = { version = "~1.2.2", features = ["unstable"] }
# Behind `radio`, at the versions `firmware/bridge/Cargo.toml` pins and with its
# `esp-radio` features, so the bridge's build unifies to the same set.
embassy-futures = { version = "0.1.2", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
esp-radio = { version = "1.0.0-beta.1", default-features = false, optional = true, features = [
  "esp-alloc",
  "esp-now",
  "unstable",
  "wifi",
] }
# The phase marker's atomics: `esp-hal` marks only `portable-atomic`'s as persistable.
portable-atomic = { version = "1.15.0", default-features = false }
wartui-proto = { path = "../../crates/wartui-proto" }

[lints.rust]
# AGENTS.md's project-wide rule; the root workspace excludes `firmware`, so it is
# stated here too. Only the PHY blob reads in `health` allow it.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
